{% extends "base.html" %}
{% block title %}Contact — Elite Legacy Marketing{% endblock %}
{% block content %}
<div class="page-heading"><div><span class="eyebrow">SUPPORT</span><h1>How can we help?</h1><p class="muted">Send a message about your account, billing or the platform.</p></div></div>
<section class="auth-card contact-card">
    <form method="post" class="form-stack"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Message<textarea name="message" rows="7" required></textarea></label><button class="button" type="submit">Send message</button></form>
    {% if support_email %}<p class="fine-print">You can also email {{ support_email }}.</p>{% endif %}
</section>
{% endblock %}
