{% extends "base.html" %}
{% block title %}Claim administrator account{% endblock %}
{% block content %}
<section class="auth-card">
    <span class="eyebrow">ONE-TIME ACCOUNT SETUP</span>
    <h1>Choose your administrator password</h1>
    <p class="muted">This link permanently expires after your password is saved.</p>
    <form method="post">
        <label>New password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
        <button class="button" type="submit">Activate my account</button>
    </form>
</section>
{% endblock %}
